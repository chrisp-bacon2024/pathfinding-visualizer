
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Pathfinding Visualizer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app">
            <header class="pageHeader">
                <h1>Pathfinding Visualizer</h1>
            </header>

            <div class="toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">Algorithms</span>

                    <div class="algorithm-buttons">
                        <button class="algorithm-btn" data-algorithm="dfs"
                                title="Depth-First Search">DFS</button>
                        <button class="algorithm-btn" data-algorithm="bfs"
                                title="Breadth-First Search">BFS</button>
                        <button class="algorithm-btn" data-algorithm="dijkstra"
                                title="Dijkstra's Algorithm">Dijkstra</button>
                        <button class="algorithm-btn" data-algorithm="astar"
                                title="A* Search">A*</button>
                        <button class="algorithm-btn" data-algorithm="greedy"
                                title="Greedy Best-First Search">Greedy</button>

                        <button class="algorithm-btn" data-algorithm="bidirectionalbfs"
                                title="Bidirectional BFS">Bi-BFS</button>
                        <button class="algorithm-btn" data-algorithm="jps"
                                title="Jump Point Search">JPS</button>
                        <button class="algorithm-btn" data-algorithm="bellmanford"
                                title="Bellman-Ford">Bellman-Ford</button>
                        <button class="algorithm-btn" data-algorithm="thetastar"
                                title="Theta*">Theta*</button>
                    </div>
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-label">Paint:</span>

                    <button class="terrain-btn selected" data-brush="wall" aria-pressed="true">Wall</button>
                    <button class="terrain-btn" data-brush="grass" aria-pressed="false">Grass</button>
                    <button class="terrain-btn" data-brush="mud" aria-pressed="false">Mud</button>
                    <button class="terrain-btn" data-brush="road" aria-pressed="false">Road</button>
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-label">Generate:</span>

                    <button id="generate-map-btn" class="generate-btn">
                        Generate Map
                    </button>
                </div>

                <div class="toolbar-group playback-group">
                    <span class="toolbar-label">Playback:</span>

                    <div class="playback-controls">
                        <input type="range" id="playback-slider" class="playback-slider"
                               min="0" max="100" value="0" step="1"
                               aria-label="Playback position">

                        <div class="playback-buttons">
                            <button id="play-pause-btn" class="play-pause-btn"
                                    aria-label="Play" aria-pressed="false">▶</button>

                            <select id="playback-speed" class="playback-speed"
                                    aria-label="Playback speed">
                                <option value="0.25">0.25x</option>
                                <option value="0.5">0.5x</option>
                                <option value="1" selected>1x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2x</option>
                                <option value="4">4x</option>
                                <option value="10">10x</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <main class="gridContainer">
                <canvas id="gridCanvas"></canvas>
            </main>
        </div>

        <script type="module" src="./main.js"></script>
    </body>
</html>
