
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Pathfinding Visualizer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app">
            <header class="pageHeader">
                <h1>Pathfinding Visualizer</h1>
            </header>

            <div class="toolbar">
                <div class="toolbar-group">
                    <span class="toolbar-label">Algorithms</span>

                    <div class="algorithm-buttons">
                        <!-- Not an algorithm: movement mode switch, sized to fit
                             one grid cell. main.js handles the clicks. -->
                        <div class="movement-toggle" role="group" aria-labelledby="movement-toggle-label">
                            <span id="movement-toggle-label" class="movement-toggle-label">Directions</span>

                            <!-- Shows the current mode; click to switch.
                                 main.js swaps the icon, text and labels. -->
                            <button id="movement-toggle-btn" class="movement-toggle-btn"
                                    aria-label="Directions: 4-way. Click to switch to 8-way."
                                    title="4-way: up, down, left and right only. Click to switch to 8-way.">
                                <!-- Compass with 4 arrows -->
                                <svg class="movement-icon" data-mode="4" viewBox="0 0 16 16" aria-hidden="true">
                                    <circle cx="8" cy="8" r="7.2" fill="none" stroke="currentColor" stroke-width="1"/>
                                    <path d="M8 4.4V11.6M4.4 8H11.6" stroke="currentColor" stroke-width="1.3"/>
                                    <path d="M8 1.8 6.2 4.4H9.8ZM8 14.2 6.2 11.6H9.8ZM14.2 8 11.6 6.2V9.8ZM1.8 8 4.4 6.2V9.8Z" fill="currentColor"/>
                                </svg>
                                <!-- Compass rose with 8 needles -->
                                <svg class="movement-icon" data-mode="8" viewBox="0 0 16 16" aria-hidden="true" hidden>
                                    <circle cx="8" cy="8" r="7.2" fill="none" stroke="currentColor" stroke-width="1"/>
                                    <!-- Same 4 arrows as the 4-way icon... -->
                                    <path d="M8 4.4V11.6M4.4 8H11.6" stroke="currentColor" stroke-width="1.3"/>
                                    <path d="M8 1.8 6.2 4.4H9.8ZM8 14.2 6.2 11.6H9.8ZM14.2 8 11.6 6.2V9.8ZM1.8 8 4.4 6.2V9.8Z" fill="currentColor"/>
                                    <!-- ...plus 4 smaller diagonal arrows. Their shafts start
                                         away from the centre so the middle stays readable at 22px. -->
                                    <path d="M9.3 6.7 10.4 5.6M9.3 9.3 10.4 10.4M6.7 9.3 5.6 10.4M6.7 6.7 5.6 5.6" stroke="currentColor" stroke-width="1.1"/>
                                    <path d="M11.9 4.1 11.2 6.5 9.5 4.8ZM11.9 11.9 11.2 9.5 9.5 11.2ZM4.1 11.9 4.8 9.5 6.5 11.2ZM4.1 4.1 4.8 6.5 6.5 4.8Z" fill="currentColor"/>
                                </svg>
                                <span class="movement-text">4-way</span>
                            </button>
                        </div>

                        <button class="algorithm-btn" data-algorithm="dfs"
                                title="Depth-First Search">DFS</button>
                        <button class="algorithm-btn" data-algorithm="bfs"
                                title="Breadth-First Search">BFS</button>
                        <button class="algorithm-btn" data-algorithm="dijkstra"
                                title="Dijkstra's Algorithm">Dijkstra</button>
                        <button class="algorithm-btn" data-algorithm="astar"
                                title="A* Search">A*</button>

                        <button class="algorithm-btn" data-algorithm="greedy"
                                title="Greedy Best-First Search">Greedy</button>
                        <button class="algorithm-btn" data-algorithm="bidirectionalbfs"
                                title="Bidirectional BFS">Bi-BFS</button>
                        <button class="algorithm-btn" data-algorithm="jps"
                                title="Jump Point Search">JPS</button>
                        <button class="algorithm-btn" data-algorithm="bellmanford"
                                title="Bellman-Ford">Bellman-Ford</button>
                        <button class="algorithm-btn" data-algorithm="thetastar"
                                title="Theta*">Theta*</button>
                    </div>
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-label">Paint:</span>

                    <button class="terrain-btn selected" data-brush="wall" aria-pressed="true">Wall</button>
                    <button class="terrain-btn" data-brush="grass" aria-pressed="false">Grass</button>
                    <button class="terrain-btn" data-brush="mud" aria-pressed="false">Mud</button>
                    <button class="terrain-btn" data-brush="road" aria-pressed="false">Road</button>
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-label">Generate:</span>

                    <button id="generate-map-btn" class="generate-btn">
                        Generate Map
                    </button>

                    <button id="clear-paths-btn" class="clear-paths-btn"
                            title="Clear all algorithm paths and search colours">
                        Clear Paths
                    </button>
                </div>

                <div class="toolbar-group playback-group">
                    <span class="toolbar-label">Playback:</span>

                    <div class="playback-controls">
                        <input type="range" id="playback-slider" class="playback-slider"
                               min="0" max="100" value="0" step="1"
                               aria-label="Playback position">

                        <div class="playback-buttons">
                            <button id="play-pause-btn" class="play-pause-btn"
                                    aria-label="Play" aria-pressed="false">▶</button>

                            <select id="playback-speed" class="playback-speed"
                                    aria-label="Playback speed">
                                <option value="0.25">0.25x</option>
                                <option value="0.5">0.5x</option>
                                <option value="1" selected>1x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2x</option>
                                <option value="4">4x</option>
                                <option value="10">10x</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <main class="gridContainer">
                <!-- Paths are drawn on their own canvas above the grid
                     (see pathOverlay.js). -->
                <div class="canvas-stack">
                    <canvas id="gridCanvas"></canvas>
                    <canvas id="pathCanvas" aria-hidden="true"></canvas>
                </div>
            </main>
        </div>

        <script type="module" src="./main.js"></script>
    </body>
</html>
